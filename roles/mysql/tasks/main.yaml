- name: Install python libraries
  ansible.builtin.pip:
    name: "{{ item }}"
    state: present
  loop:
  - botocore
  - boto3
  - PyMySQL
- name: install mysql-server
  ansible.builtin.package:
    name: mysql-server
    state: installed

- name: start and enable mysql-server service
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: connect to mysql-server
  community.mysql.mysql_info:
    login_user: root
    login_password: "{{ lookup('amazon.aws.aws_ssm', '/expense/mysql/mysql_root_password', decrypt=true ) }}"
    login_host: mysql.pavancloud5.online
  register: MYSQL_INFO
  ignore_errors: true

- name: print the output
  ansible.builtin.debug:
    msg: "{{ MYSQL_INFO }}"

- name: setup root password
  ansible.builtin.command: mysql_secure_installation --set-root-pass "{{ lookup('amazon.aws.aws_ssm', '/expense/mysql/mysql_root_password', decrypt=true ) }}"
  when: MYSQL_INFO.failed is true